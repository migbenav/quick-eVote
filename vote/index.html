<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Votación de propietarios</title><link rel="stylesheet" href="../styles.css"></head>
<body><header><h1>Votación de propietarios</h1></header><main>
